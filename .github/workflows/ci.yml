name: MLOps CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint:
    name: Code quality (Ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install Ruff
        run: python -m pip install 'ruff>=0.9,<1'
      - name: Check syntax and undefined names
        run: ruff check activity_01_training activity_03_fastapi activity_05_cicd --select E4,E7,E9,F821,F822,F823,F831

  fastapi-tests:
    name: FastAPI regression tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: activity_03_fastapi/requirements.txt
      - name: Install CPU-only PyTorch
        run: python -m pip install --index-url https://download.pytorch.org/whl/cpu torch torchvision
      - name: Install API test dependencies
        run: python -m pip install -r activity_03_fastapi/requirements.txt
      - name: Generate untrained checkpoint for software tests
        run: python activity_05_cicd/create_test_checkpoint.py
      - name: Run FastAPI tests
        run: python -m pytest -q activity_03_fastapi/test_api.py
