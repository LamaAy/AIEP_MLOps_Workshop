name: MLOps CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  fastapi-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: activity_03_fastapi/requirements.txt

      - name: Install CPU-only PyTorch
        run: python -m pip install --index-url https://download.pytorch.org/whl/cpu torch torchvision

      - name: Install API test dependencies
        run: python -m pip install -r activity_03_fastapi/requirements.txt

      - name: Generate CI-only checkpoint
        run: python activity_05_cicd/create_test_checkpoint.py

      - name: Run API tests
        run: python -m pytest -q activity_03_fastapi/test_api.py
